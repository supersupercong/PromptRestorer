# general settings
name: 014_FeMaSR_LQ_stage
# name: debug_FeMaSR
model_type: FeMaSRModel 
scale: &upscale 1
num_gpu: 1 # set num_gpu: 0 for cpu mode
manual_seed: 0

# dataset and data loader settings
datasets:
  train:
    name: General_Image_Train
    type: PairedImageDataset
#    dataroot_gt: ../datasets/HQ_sub
    # type: PairedImageDataset
    dataroot_gt: /data_8T1/wangcong/dataset/Deblur_dataset/GoPro_patch/train/target_crops
    dataroot_lq: /data_8T1/wangcong/dataset/Deblur_dataset/GoPro_patch/train/input_crops
#    dataroot_gt: /data_8T1/wangcong/dataset/Rain13K/rain13ktrain/Rain13K/target
#    dataroot_lq: /data_8T1/wangcong/dataset/Rain13K/rain13ktrain/Rain13K/input
    # /data/wangcong/dataset/Rain13K/rain13ktrain/Rain13K/input
    io_backend:
      type: disk

    gt_size: 256
    use_resize_crop: False
    geometric_augs: True
    use_flip: True
    use_rot: False

    # data loader
    use_shuffle: true
    batch_size_per_gpu: &bsz 1
    num_worker_per_gpu: *bsz
    dataset_enlarge_ratio: 1

    prefetch_mode: cpu
    num_prefetch_queue: *bsz

  val:
    name: General_Image_Valid
    type: PairedImageDataset
    dataroot_gt: /data_8T1/wangcong/dataset/Deblur_dataset/GoPro_patch/test/input_crops
    dataroot_lq: /data_8T1/wangcong/dataset/Deblur_dataset/GoPro_patch/test/input_crops
    gt_size: 256
    io_backend:
      type: disk
    use_resize_crop: False
    use_flip: False
    use_rot: False

# network structures
network_g:
  type: FeMaSRNet
  gt_resolution: 256
  norm_type: 'gn'
  act_type: 'silu'
  scale_factor: *upscale
  codebook_params: # has to order from low to high
    - [ 32, 1024, 256 ]
    - [ 64, 1024, 128 ]
    - [ 128, 1024, 64 ]
    - [ 256, 1024, 32 ]

  length_list: [2, 3, 5, 3]
  LQ_stage: true
  frozen_module_keywords: ['encoder', 'before_quant_group','quantize', 'decoder', 'after_quant_group', 'out_conv']

  Net_type: 'encoder_decoder' # encoder_decoder, encoder, wo_perception, encoder_decoder_learnable
  degregation_propagate: True
  local_perception: True
  global_perception: True
  local_degregation_aware_restore_aware: True
  local_degregation_aware: False
  local_restore_aware: False
  global_degregation_aware_restore_aware: True
  global_degregation_aware: False
  global_restore_aware: False
  perception_SFT: False

network_d:
  type: UNetDiscriminatorSN
  num_in_ch: 3

# path
path:
#  pretrain_network_hq: /data_8T1/wangcong/net_g_260000.pth
#  pretrain_network_g: /data_8T1/wangcong/NeurIPS/335-DPT-base-dense/experiments/014_FeMaSR_LQ_stage/models/net_g_120000.pth
#  pretrain_network_d: ~
#  strict_load: false
#  resume_state: /data_8T1/wangcong/NeurIPS/335-DPT-base-dense/experiments/014_FeMaSR_LQ_stage/training_states/120000.state

#  pretrain_network_hq: /home/wz/wangwei/NeurIPS/net_g_260000.pth
#  pretrain_network_g: /home/wz/wangwei/NeurIPS/519-DPT256-newdeblur/net_g_250000.pth
#  pretrain_network_d: ~
#  strict_load: false
#  resume_state: /home/wz/wangwei/NeurIPS/519-DPT256-newdeblur/250000.state
  pretrain_network_hq: /data_8T1/wangcong/net_g_260000.pth
  pretrain_network_g: ~
  pretrain_network_d: ~
  strict_load: false
  resume_state: ~


# training settings
train:
  optim_g:
    type: AdamW
    lr: !!float 5e-5
    weight_decay: !!float 1e-3
    betas: [0.9, 0.99]
  optim_d:
    type: Adam
    lr: !!float 4e-4
    weight_decay: 0
    betas: [0.9, 0.99]

#  scheduler:
#    type: MultiStepLR
#    # milestones: [50000, 100000, 200000, 300000]
#    # gamma: 1
#    milestones: [120000,150000,180000,210000]
#    gamma: 0.3 CosineAnnealingRestartLR
  scheduler:
    type: CosineAnnealingRestartCyclicLR
    periods: [100, 251000]
    restart_weights: [1, 1]
    eta_mins: [ 0.00005, 0.0000001]

  total_iter: 251100
  warmup_iter: -1  # no warm up

  # losses
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean
  pixel_ssim_opt:
    loss_weight: !!float 0.25

  fft_opt:
    type: FFTLoss
    loss_weight: !!float 0.1


  perceptual_opt:
    type: LPIPSLoss
    loss_weight: !!float 0

  gan_opt:
    type: GANLoss
    gan_type: hinge
    real_label_val: 1.0
    fake_label_val: 0.0
    loss_weight: 0

  codebook_opt:
    loss_weight: 0

  semantic_opt:
    loss_weight: 0

  net_d_iters: 0
  net_d_init_iters: !!float 0

# validation settings·
val:
  val_freq: !!float 50000000000
  save_img: true

  key_metric: ssim
  metrics:
    psnr: # metric name, can be arbitrary
      type: psnr
      crop_border: 4
      test_y_channel: true
    ssim:
      type: ssim
      crop_border: 4
      test_y_channel: true
    lpips:
      type: lpips
      better: lower

# logging settings
logger:
  print_freq: 100
  save_checkpoint_freq: !!float 1e9
  save_latest_freq: !!float 1e4
  show_tf_imgs_freq: !!float 5000
  use_tb_logger: true

# wandb:
    # project: ESRGAN
    # resume_id: ~

dist_params:
  backend: nccl
  port: 16500 #29500
find_unused_parameters: true